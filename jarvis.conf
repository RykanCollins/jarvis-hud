conky.config = {
    -- Window
    own_window           = true,
    own_window_type      = 'desktop',
    own_window_hints     = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value  = 0,
    own_window_colour    = '020c18',
    own_window_transparent = true,

    -- Position — right side of screen, leaving taskbar room
    alignment            = 'top_right',
    gap_x                = 20,
    gap_y                = 40,

    -- Size
    minimum_width        = 300,
    maximum_width        = 300,

    -- Rendering
    double_buffer        = true,
    use_xft              = true,
    xftalpha             = 1,
    font                 = 'Share Tech Mono:size=9',
    override_utf8_locale = true,

    -- Updates
    update_interval      = 1.5,
    total_run_times      = 0,

    -- No border/bg — we draw our own
    draw_borders         = false,
    draw_graph_borders   = false,
    draw_outline         = false,
    draw_shades          = false,
    background           = false,

    -- Colors
    default_color        = '7ab8d4',
    color1               = '00b4ff',   -- arc blue
    color2               = 'ffd700',   -- gold
    color3               = '00ff88',   -- green ok
    color4               = 'ff3c3c',   -- red alert
    color5               = '405060',   -- muted border
    color6               = 'c8e8ff',   -- bright fg
    color7               = '1a3040',   -- dark panel bg (unused — ARGB handles it)
};

conky.text = [[
${color1}${font Orbitron:bold:size=10}J . A . R . V . I . S${font}${color}
${color5}────────────────────────────────${color}
${color1}▸${color} ${font Orbitron:size=7}SYSTEM VITALS${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
  ${color5}CPU${color}  ${color1}${cpu cpu0}%${color}  ${cpubar cpu0 6,220}
  ${color5}CPU1${color} ${cpu cpu1}%  ${color5}CPU2${color} ${cpu cpu2}%  ${color5}CPU3${color} ${cpu cpu3}%  ${color5}CPU4${color} ${cpu cpu4}%
  ${color5}MEM${color}  ${color2}${memperc}%${color}  ${membar 6,220}
  ${color5}SWAP${color} ${swapperc}%  ${swapbar 6,220}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
  ${color5}LOAD${color}  ${color6}${loadavg 1} ${loadavg 2} ${loadavg 3}${color}
  ${color5}UPTIME${color} ${color6}${uptime}${color}
  ${color5}PROCS${color}  ${color6}${processes}${color} running: ${color3}${running_processes}${color}

${color1}▸${color} ${font Orbitron:size=7}THERMAL${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
${if_existing /sys/class/thermal/thermal_zone0/temp}  ${color5}ZONE 0${color} ${color4}${execi 3 awk '{printf "%.0f°C", $1/1000}' /sys/class/thermal/thermal_zone0/temp}${color}${endif}
${if_existing /sys/class/thermal/thermal_zone1/temp}  ${color5}ZONE 1${color} ${color4}${execi 3 awk '{printf "%.0f°C", $1/1000}' /sys/class/thermal/thermal_zone1/temp}${color}${endif}

${color1}▸${color} ${font Orbitron:size=7}STORAGE${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
  ${color5}/     ${color} ${color2}${fs_used /}${color} / ${fs_size /}  ${fs_bar 6,220 /}
  ${color5}READ  ${color} ${color1}${diskio_read}${color}  ${color5}WRITE${color} ${color2}${diskio_write}${color}

${color1}▸${color} ${font Orbitron:size=7}NETWORK${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
${if_up wlan0}  ${color5}IFACE ${color} ${color3}wlan0${color}
  ${color5}SSID  ${color} ${color6}${wireless_essid wlan0}${color}  ${color5}SIG${color} ${wireless_link_qual_perc wlan0}%
  ${color5}IP    ${color} ${color6}${addr wlan0}${color}
  ${color5}TX    ${color} ${color1}${upspeed wlan0}${color}  ${color5}RX${color} ${color3}${downspeed wlan0}${color}
${else}${if_up eth0}  ${color5}IFACE ${color} ${color3}eth0${color}
  ${color5}IP    ${color} ${color6}${addr eth0}${color}
  ${color5}TX    ${color} ${color1}${upspeed eth0}${color}  ${color5}RX${color} ${color3}${downspeed eth0}${color}
${else}${if_up enp0s3}  ${color5}IFACE ${color} ${color3}enp0s3${color}
  ${color5}IP    ${color} ${color6}${addr enp0s3}${color}
  ${color5}TX    ${color} ${color1}${upspeed enp0s3}${color}  ${color5}RX${color} ${color3}${downspeed enp0s3}${color}
${else}  ${color4}NO NETWORK INTERFACE${color}
${endif}${endif}${endif}

${color1}▸${color} ${font Orbitron:size=7}TOP PROCESSES${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
  ${color5}NAME             CPU%   MEM%${color}
  ${color6}${top name 1}${color1}${top cpu 1}%  ${color2}${top mem 1}%${color}
  ${color6}${top name 2}${color}${top cpu 2}%  ${top mem 2}%
  ${color6}${top name 3}${color}${top cpu 3}%  ${top mem 3}%
  ${color6}${top name 4}${color}${top cpu 4}%  ${top mem 4}%
  ${color6}${top name 5}${color}${top cpu 5}%  ${top mem 5}%

${color1}▸${color} ${font Orbitron:size=7}LAN SCANNER${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
  ${color5}SUBNET${color} ${color6}192.168.12.0/24${color}
${color6}${execi 60 ~/.config/conky/net_scan.sh}${color}

${color1}▸${color} ${font Orbitron:size=7}DATE / TIME${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
  ${color1}${font Orbitron:bold:size=18}${time %H:%M:%S}${font}${color}
  ${color5}${time %A, %d %B %Y}${color}

${color5}────────────────────────────────${color}
${color5}${font Orbitron:size=6}MARK L  ·  ARC REACTOR  ·  NOMINAL${font}${color}
]];
