conky.config = {
    own_window           = true,
    own_window_type      = 'desktop',
    own_window_hints     = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value  = 0,
    own_window_transparent = true,

    -- Position — left side of screen
    alignment            = 'top_left',
    gap_x                = 20,
    gap_y                = 40,

    minimum_width        = 300,
    maximum_width        = 300,
    minimum_height       = 340,

    double_buffer        = true,
    use_xft              = true,
    xftalpha             = 1,
    font                 = 'Share Tech Mono:size=9',
    override_utf8_locale = true,

    update_interval      = 3,
    total_run_times      = 0,

    draw_borders         = false,
    draw_graph_borders   = false,
    draw_outline         = false,
    draw_shades          = false,
    background           = false,

    default_color        = '7ab8d4',
    color1               = '00b4ff',
    color2               = 'ffd700',
    color3               = '00ff88',
    color4               = 'ff3c3c',
    color5               = '405060',
    color6               = 'c8e8ff',
};

conky.text = [[
${color1}${font Orbitron:bold:size=10}A R C  ·  R A D A R${font}${color}
${color5}────────────────────────────────${color}
${color1}▸${color} ${font Orbitron:size=7}SYSTEM LOAD${font}
${color5}  ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄${color}
${execi 3 python3 ~/.config/conky/radar_chart.py}${image ~/.config/conky/radar.png -p 10,0 -s 280x280 -n}
${voffset 285}
  ${color5}CPU${color}  ${color1}${cpu cpu0}%${color}   ${color5}MEM${color}  ${color2}${memperc}%${color}   ${color5}SWAP${color} ${swapperc}%
  ${color5}DISK${color} ${color6}${fs_used_perc /}%${color}   ${color5}LOAD${color} ${color6}${loadavg 1}${color}
${color5}────────────────────────────────${color}
${color5}${font Orbitron:size=6}ARC REACTOR  ·  POWER NOMINAL${font}${color}
]];
